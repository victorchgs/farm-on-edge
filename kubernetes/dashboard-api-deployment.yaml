apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      nodeSelector:
        node-role: master
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: dashboard-api
          image: 192.168.1.200:5000/farmonedge-dashboard-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: VITE_APP_ENV
              value: "local"
            - name: LOCAL_USER
              value: "admin"
            - name: LOCAL_PASSWORD
              value: "admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
spec:
  selector:
    app: dashboard-api
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
